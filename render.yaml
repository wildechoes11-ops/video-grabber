services:
  - type: web
    name: video-grabber
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: MAX_CONCURRENT
        value: "10"
      - key: PROXY_DETAILS_URL
        value: https://proxys-o6v0.onrender.com/proxy/details
      - key: YTDLP_COOKIE
        sync: false
      - key: YTDLP_TOKEN
        sync: false
